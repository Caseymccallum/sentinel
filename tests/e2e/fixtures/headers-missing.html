    <h1>No-header fixture page</h1>
    <p>
      Served over HTTPS with <strong>no</strong> security headers at all. Every header signal should
      measure zero here, which is the strongest statement Sentinel makes from response headers -
      and the reason a missing header is only scored when the headers were actually captured.
